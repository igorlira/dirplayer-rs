[package]
name = "vm-rust"
version = "0.1.0"
authors = ["Igor Lira <lira@hey.com>"]
description = "A web-compatible Shockwave Player emulator written in Rust"
repository = "https://github.com/igorlira/dirplayer-rs"
license = "GPL-3.0-only"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]
word_hard_break = []
alloc-debug-overlay = []

[dependencies]
wasm-bindgen = "=0.2.108"

# SDK for external Xtras. vm-rust uses it to decode the wire format that
# plugin .wasm modules exchange with the host. Plugins depend on the same
# crate; the path link makes them version-locked together in this repo.
xtra-sdk = { path = "../xtra-sdk" }

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "0.1.7", optional = true }
wasm-bindgen-futures = "=0.4.58"
js-sys = "=0.3.85"
binary-reader = "0.4.5"
num = "0.4.1"
num-derive = "0.4.0"
num-traits = "0.2.16"
itertools = "0.11.0"
url = "2.4.1"
manual_future = "0.1.1"
futures = "0.3.30"
pest = "2.7.8"
pest_derive = "2.7.8"
chrono = "0.4.35"
rgb565 = "0.1.3"
bitvec = "1.0.1"
fxhash = "0.2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-recursion = "1.1.1"
console_log = "1.0.0"
log = "0.4.22"
percent-encoding = "2"
xml = "1.0"
image = "0.25.8"
rand = { version = "0.9", features = ["small_rng"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
base64 = "0.22"
toml = "0.8"
dotenvy = "0.15"
binary_rw = "4.1.0"
# Polygon-with-holes triangulation (mapbox earcut port, pure Rust / WASM-safe).
# Used for 3D-text (extrude3D) front/back cap tessellation so glyph holes
# (O, A, 8, e ...) are filled correctly instead of the old triangle-fan.
earcutr = "0.4"
lasso = "0.7.3"

[dev-dependencies]
wasm-bindgen-test = "0.3.34"

[dependencies.async-std]
version = "1.12.0"
features = ["unstable"]

[dependencies.web-sys]
version = "=0.3.85"
features = [
  'ImageData',
  'ImageBitmap',
  'CanvasRenderingContext2d',
  'TextMetrics',
  'Document',
  'Element',
  'EventTarget',
  'HtmlCanvasElement',
  'HtmlElement',
  'MouseEvent',
  'Node',
  'Window',
  'Crypto',
  'Location',
  'console',
  'Headers',
  'Request',
  'RequestInit',
  'RequestMode',
  'Response',
  'ReadableStream',
  'ReadableStreamDefaultReader',
  'console',
  'CssStyleDeclaration',
  'BinaryType',
  'Blob',
  'CloseEvent',
  'ErrorEvent',
  'FileReader',
  'MessageEvent',
  'ProgressEvent',
  'WebSocket',
  'CustomEvent',
  'CustomEventInit',
  'Event',
  'AudioContext',
  'AudioBuffer',
  'AudioBufferSourceNode',
  'GainNode',
  'StereoPannerNode',
  'AudioParam',
  'AudioNode',
  'AudioDestinationNode',
  'Blob',
  'BlobPropertyBag',
  'Url',
  'HtmlAudioElement',
  'OfflineAudioContext',
  'AudioContextState',
  # WebGL2 features for GPU-accelerated rendering
  'WebGl2RenderingContext',
  'WebGlProgram',
  'WebGlShader',
  'WebGlBuffer',
  'WebGlTexture',
  'WebGlFramebuffer',
  'WebGlRenderbuffer',
  'WebGlUniformLocation',
  'WebGlVertexArrayObject',
  'WebGlActiveInfo',
  'WebGlContextAttributes',
  'MessageChannel',
  'MessagePort',
  'Storage',
  'Navigator',
  'Screen',
  'Performance',
  'Clipboard',
  'FormData',
]

[dependencies.flate2]
version = "1.0.27"
features = ["rust_backend"]
default-features = false

# `npm run build-vm` (wasm-pack --release) — the SHIPPING build, and the only
# one any performance number may be quoted from. Takes ~6 min; for iteration
# use `npm run build-vm-dev` (~2 min, see [profile.dev] below).
[profile.release]
# Optimize for SPEED. The Lingo interpreter's hot loop is built out of
# `#[inline(always)]` closures (`reserve_player_mut`) over a jump-table `match`;
# `opt-level = "s"` is exactly the setting that suppresses that inlining, so the
# per-op cost was paying for closure calls that were meant to vanish.
opt-level = 3
# `lto = "fat"` and `codegen-units = 1` are most of the 6 minutes: whole-program
# optimization at link time, and no parallelism across codegen units.
lto = "fat"
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
# -O4 rather than -O, and drop -g: debug symbols inhibit some wasm-opt passes
# and roughly double the .wasm.
wasm-opt = ["-O4"]

# `npm run build-vm-dev` (wasm-pack --dev) — the FAST ITERATION build.
#
# These are the settings release used before it was tuned for speed: size-level
# optimisation, no LTO, default (parallel) codegen units, incremental. That is
# what made it a ~2 min build rather than ~6.
#
# DO NOT quote performance numbers from this build. It is meaningfully slower at
# runtime than `build-vm`, so comparing a measurement taken here against one
# taken there compares profiles, not code.
[profile.dev]
opt-level = "s"
# Debug info is the other half of the build time and doubles the .wasm; the
# wasm-bindgen dwarf setting below is what actually gives usable symbols.
debug = false
# Match release SEMANTICS. With these on, dev can panic where release wraps —
# so a bug reproduced here might not exist in the shipping build, or vice versa.
debug-assertions = false
overflow-checks = false
incremental = true

[profile.dev.package."*"]
# Dependencies are rebuilt rarely, so optimise them harder than our own crate.
opt-level = 2

[package.metadata.wasm-pack.profile.dev]
# wasm-pack disables wasm-opt for --dev by default. `-O` (not `-O4`) keeps the
# module reasonable without the long optimisation passes; `-g` preserves the
# symbols that make a stack trace readable. If this build is still too slow,
# `wasm-opt = false` is the next lever — it is the largest remaining cost, and
# also the largest runtime regression.
wasm-opt = ["-O", "-g"]

[package.metadata.wasm-pack.profile.dev.wasm-bindgen]
dwarf-debug-info = true

[package.metadata.wasm-pack.profile.release.wasm-bindgen]
dwarf-debug-info = false
