[package]
name = "vm-rust"
version = "0.1.0"
authors = ["Igor Lira <lira@hey.com>"]
description = "A web-compatible Shockwave Player emulator written in Rust"
repository = "https://github.com/igorlira/dirplayer-rs"
license = "GPL-3.0-only"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]
word_hard_break = []
alloc-debug-overlay = []

[dependencies]
wasm-bindgen = "=0.2.108"

# Insertion-ordered map. `externalParamName(n)` / `externalParamValue(n)` are
# INDEXED accessors in Director — the params keep the order the host handed
# them over in (query string / <param> tags / LeechProtectionRemovalHelp's
# setExternalParam), so a plain HashMap would randomise them.
indexmap = { version = "2", features = ["serde"] }

# SDK for external Xtras. vm-rust uses it to decode the wire format that
# plugin .wasm modules exchange with the host. Plugins depend on the same
# crate; the path link makes them version-locked together in this repo.
xtra-sdk = { path = "../xtra-sdk" }

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "0.1.7", optional = true }
wasm-bindgen-futures = "=0.4.58"
js-sys = "=0.3.85"
binary-reader = "0.4.5"
num = "0.4.1"
num-derive = "0.4.0"
num-traits = "0.2.16"
itertools = "0.11.0"
url = "2.4.1"
manual_future = "0.1.1"
futures = "0.3.30"
pest = "2.7.8"
pest_derive = "2.7.8"
chrono = "0.4.35"
rgb565 = "0.1.3"
bitvec = "1.0.1"
fxhash = "0.2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
async-recursion = "1.1.1"
console_log = "1.0.0"
log = "0.4.22"
percent-encoding = "2"
xml = "1.0"
image = "0.25.8"
rand = { version = "0.9", features = ["small_rng"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
base64 = "0.22"
toml = "0.8"
dotenvy = "0.15"
binary_rw = "4.1.0"
# Polygon-with-holes triangulation (mapbox earcut port, pure Rust / WASM-safe).
# Used for 3D-text (extrude3D) front/back cap tessellation so glyph holes
# (O, A, 8, e ...) are filled correctly instead of the old triangle-fan.
earcutr = "0.4"
lasso = "0.7.3"

[dev-dependencies]
wasm-bindgen-test = "0.3.34"

[dependencies.async-std]
version = "1.12.0"
features = ["unstable"]

[dependencies.web-sys]
version = "=0.3.85"
features = [
  'ImageData',
  'ImageBitmap',
  'CanvasRenderingContext2d',
  'TextMetrics',
  'Document',
  'Element',
  'EventTarget',
  'HtmlCanvasElement',
  'HtmlElement',
  'MouseEvent',
  'Node',
  'Window',
  'Crypto',
  'Location',
  'console',
  'Headers',
  'Request',
  'RequestInit',
  'RequestMode',
  'Response',
  'ReadableStream',
  'ReadableStreamDefaultReader',
  'console',
  'CssStyleDeclaration',
  'BinaryType',
  'Blob',
  'CloseEvent',
  'ErrorEvent',
  'FileReader',
  'MessageEvent',
  'ProgressEvent',
  'WebSocket',
  'CustomEvent',
  'CustomEventInit',
  'Event',
  'AudioContext',
  'AudioBuffer',
  'AudioBufferSourceNode',
  'GainNode',
  'StereoPannerNode',
  'AudioParam',
  'AudioNode',
  'AudioDestinationNode',
  'Blob',
  'BlobPropertyBag',
  'Url',
  'HtmlAudioElement',
  'OfflineAudioContext',
  'AudioContextState',
  # WebGL2 features for GPU-accelerated rendering
  'WebGl2RenderingContext',
  'WebGlProgram',
  'WebGlShader',
  'WebGlBuffer',
  'WebGlTexture',
  'WebGlFramebuffer',
  'WebGlRenderbuffer',
  'WebGlUniformLocation',
  'WebGlVertexArrayObject',
  'WebGlActiveInfo',
  'WebGlContextAttributes',
  'MessageChannel',
  'MessagePort',
  'Storage',
  'Navigator',
  'Screen',
  'Performance',
  'Clipboard',
  'FormData',
]

[dependencies.flate2]
version = "1.0.27"
features = ["rust_backend"]
default-features = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4"]

[package.metadata.wasm-pack.profile.release.wasm-bindgen]
dwarf-debug-info = false

[profile.dev]
opt-level = "s"
debug = "line-tables-only"
debug-assertions = false
overflow-checks = false
incremental = true

[profile.dev.package."*"]
opt-level = 2

[package.metadata.wasm-pack.profile.dev]
wasm-opt = ["-O", "-g"]

[package.metadata.wasm-pack.profile.dev.wasm-bindgen]
dwarf-debug-info = false
