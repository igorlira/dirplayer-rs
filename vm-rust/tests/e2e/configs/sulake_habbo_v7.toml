[movie]
path = "dcr_sulake/habbo_v7/habbo.dcr"

[test]
suite = "sulake"
# Live multiuser: this movie logs a REAL account into the Habbo server, shared
# across every habbo test. Pin them to one shard so they run in sequence --
# concurrently they fight over the same user and one of them hangs.
shard_group = "habbo"
tags = ["2d"]

[params]
username = "${HABBO_V7_USERNAME:testuser}"
password = "${HABBO_V7_PASSWORD:testpass1}"

[external_params]
sw1 = "connection.info.host=${HABBO_V7_INFO_HOST:127.0.0.1}"
sw2 = "connection.info.port=${HABBO_V7_INFO_PORT:3091}"
multiuser_websocket_ssl = "${HABBO_V7_WS_SSL}"
multiuser_websocket_path = "${HABBO_V7_WS_PATH}"
